<!DOCTYPE html>
<html>
<head>
    <title>My Music Player</title>

   <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;

        background-size: cover;
        background-position: center;
        background-attachment: fixed;

        color: white;
        font-family: Arial, sans-serif;

        display: flex;
        justify-content: center;
        align-items: center;

        position: relative;
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;

        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(3px);

        z-index: -1;
    }

    .player {
        width: 450px;
        padding: 45px 40px;

        background: rgba(20, 20, 20, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.2);

        border-radius: 30px;

        backdrop-filter: blur(18px);

        box-shadow:
            0 25px 60px rgba(0, 0, 0, 0.5);

        text-align: center;
    }

    .player h1 {
        font-size: 32px;
        margin: 0 0 15px;
    }

    .player h2 {
        font-size: 22px;
        margin: 10px 0 25px;

        text-transform: capitalize;
    }

    audio {
        width: 100%;
        margin-top: 15px;
    }
</style>
</head>

<body>
    

    <div class="player">

        <h1>🎵 My Music Player</h1>

        <h2 id="playlistName">Loading...</h2>

        <audio id="player" controls></audio>
<div class="controls">

    <button onclick="previousSong()">⏮</button>

    <button onclick="togglePlay()" id="playButton">▶️</button>

    <button onclick="nextSong()">⏭</button>

</div>
    </div>


    

   
<script>
const params = new URLSearchParams(window.location.search);
const playlist = params.get("playlist");

const backgrounds = {
    village: "village.png",
    town: "town.png",
    mountain: "mountain.png",
    river: "river.png",
    rain: "rain.png",
    forest: "forest.png"
};

const playlistName = document.getElementById("playlistName");
const player = document.getElementById("player");
const playButton = document.getElementById("playButton");

playlistName.innerText = playlist || "Music";

document.body.style.background = `
    linear-gradient(
        ${mood.overlay},
        rgba(0, 0, 0, 0.38)
    ),
    url("${place}.png") center / cover no-repeat fixed
`;

let playlistSongs = [];
let shuffledSongs = [];
let currentSong = 0;


// -----------------------------
// CREATE RANDOM PLAYLIST ORDER
// -----------------------------
function createShuffle() {
    shuffledSongs = [...playlistSongs];

    // Fisher-Yates shuffle
    for (let i = shuffledSongs.length - 1; i > 0; i--) {
        const randomIndex = Math.floor(Math.random() * (i + 1));

        [shuffledSongs[i], shuffledSongs[randomIndex]] =
            [shuffledSongs[randomIndex], shuffledSongs[i]];
    }

    // Make sure we don't accidentally get the exact
    // same order as the original playlist
    if (playlistSongs.length > 2) {
        let sameOrder = true;

        for (let i = 0; i < playlistSongs.length; i++) {
            if (playlistSongs[i].file !== shuffledSongs[i].file) {
                sameOrder = false;
                break;
            }
        }

        if (sameOrder) {
            createShuffle();
            return;
        }
    }

    currentSong = 0;

    console.log(
        "Original order:",
        playlistSongs.map(song => song.name)
    );

    console.log(
        "Shuffled order:",
        shuffledSongs.map(song => song.name)
    );
}


// -----------------------------
// LOAD PLAYLIST
// -----------------------------
async function loadPlaylist() {
    try {
        const response = await fetch("/api/playlists");

        if (!response.ok) {
            throw new Error("Failed to fetch playlists");
        }

        const allPlaylists = await response.json();

        playlistSongs = allPlaylists[playlist] || [];

        if (playlistSongs.length === 0) {
            console.error("No songs found for:", playlist);
            return;
        }

        console.log(
            playlist,
            "contains",
            playlistSongs.length,
            "songs"
        );

        createShuffle();

        loadSong();

    } catch (error) {
        console.error("Playlist loading failed:", error);
    }
}


// -----------------------------
// LOAD CURRENT SHUFFLED SONG
// -----------------------------
function loadSong() {
    if (shuffledSongs.length === 0) {
        return;
    }

    const song = shuffledSongs[currentSong];

    console.log(
        "Playing:",
        song.name
    );

    console.log(
        "Position:",
        currentSong + 1,
        "/",
        shuffledSongs.length
    );

    player.src = song.file;
    player.load();
}


// -----------------------------
// PLAY / PAUSE
// -----------------------------
function togglePlay() {
    if (player.paused) {

        player.play()
            .then(() => {
                playButton.innerText = "Ⅱ";
            })
            .catch(error => {
                console.error("Play failed:", error);
            });

    } else {

        player.pause();
        playButton.innerText = "▶️";
    }
}


// -----------------------------
// NEXT SHUFFLED SONG
// -----------------------------
function nextSong() {

    if (shuffledSongs.length === 0) {
        return;
    }

    currentSong++;

    // When shuffled queue ends,
    // create a completely new shuffle
    if (currentSong >= shuffledSongs.length) {
        createShuffle();
    }

    loadSong();

    player.play()
        .then(() => {
            playButton.innerText = "Ⅱ";
        })
        .catch(error => {
            console.error("Next song failed:", error);
        });
}


// -----------------------------
// PREVIOUS SONG
// -----------------------------
function previousSong() {

    if (shuffledSongs.length === 0) {
        return;
    }

    currentSong--;

    if (currentSong < 0) {
        currentSong = shuffledSongs.length - 1;
    }

    loadSong();

    player.play()
        .then(() => {
            playButton.innerText = "Ⅱ";
        })
        .catch(error => {
            console.error("Previous song failed:", error);
        });
}


// -----------------------------
// AUTOMATIC NEXT SONG
// -----------------------------
player.addEventListener("ended", () => {

    if (shuffledSongs.length === 0) {
        return;
    }

    currentSong++;

    // New shuffle when the current shuffled list finishes
    if (currentSong >= shuffledSongs.length) {
        createShuffle();
    }

    loadSong();

    player.play()
        .then(() => {
            playButton.innerText = "Ⅱ";
        })
        .catch(error => {
            console.error(
                "Automatic next song failed:",
                error
            );
        });
});


// -----------------------------
// START
// -----------------------------
loadPlaylist();
</script>

</body>
</html>
